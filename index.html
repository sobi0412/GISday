<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GIS Day 2026</title>

<style>
:root{
    --primary:#0F172A;
    --secondary:#2563EB;
    --accent:#F59E0B;
    --success:#10B981;

    --bg:#F8FAFC;
    --card:#FFFFFF;

    --text:#1E293B;
    --muted:#64748B;

    --line:#E2E8F0;

    --shadow:0 10px 30px rgba(15,23,42,0.08);

    --radius:20px;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

/* Language Switch */
.lang-switch{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
    display:flex;
    gap:8px;
}

.lang-switch button{
    border:none;
    cursor:pointer;
    padding:10px 18px;
    border-radius:30px;
    background:#ffffff;
    font-weight:600;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    transition:.3s;
}

.lang-switch button:hover{
    transform:translateY(-2px);
}

.lang-switch button.active{
    background:var(--accent);
    color:white;
}

/* Hero */

.hero{
    position:relative;

 padding:90px 20px 70px;

 background:
 linear-gradient(
 135deg,
 #0F172A,
 #1E293B);

 color:white;

 text-align:center;

 overflow:hidden;
}

.hero-logo{
    position:absolute;

    left:40px;
    top:50%;

    transform:translateY(-50%);

    height:80px;
    width:auto;

    object-fit:contain;

    filter:drop-shadow(
        0 4px 12px rgba(0,0,0,.20)
    );
}

.badge{
    display:inline-block;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.12);

    border-radius:999px;

    padding:12px 24px;

    font-weight:700;

    letter-spacing:.08em;
}

.hero p{
    font-size:1.15rem;
    max-width:800px;
    margin:auto;
    opacity:.95;
}

/* Sections */
.container{
    max-width:1200px;
    margin:auto;
    padding:80px 20px;
}

.section-title{
    text-align:center;
    color:var(--primary);
    font-size:2.2rem;
    margin-bottom:40px;
}

/* Info Cards */
.info-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:24px;
}

.card{
    background:white;

    padding:32px;

    border-radius:20px;

    text-align:center;

    border:1px solid #E2E8F0;

    box-shadow:var(--shadow);

    transition:.25s;
}

.card:hover{
    transform:translateY(-3px);

    border-color:#BFDBFE;
}

.card strong{
    display:block;
    color:var(--primary);
    margin-bottom:8px;
    font-size:1.05rem;
}

/* Timeline Agenda */
.timeline{
    max-width:1000px;
    margin:auto;
}

.timeline-item{
    display:grid;
    grid-template-columns:100px 40px 1fr;
    gap:20px;
    margin-bottom:24px;
}

.timeline-time{
    text-align:right;
    font-weight:700;
    color:var(--primary);
    padding-top:18px;
}

.timeline-marker{
    position:relative;
    display:flex;
    justify-content:center;
}

.timeline-marker::before{
    content:"";
    position:absolute;
    width:3px;
    top:0;
    bottom:-24px;
    background:var(--line);
}

.timeline-item:last-child .timeline-marker::before{
    display:none;
}

.timeline-dot{
    width:18px;
    height:18px;
    margin-top:20px;

    background:var(--accent);

    border-radius:50%;

    border:4px solid white;

    box-shadow:
        0 0 0 3px var(--line);

    position:relative;
    z-index:2;
}

.timeline-content{
    background:var(--card);
    padding:24px 28px;

    border-radius:20px;

    box-shadow:var(--shadow);

    transition:all .25s ease;
}

.timeline-content:hover{
    transform:translateY(-2px);

    box-shadow:
        0 16px 40px rgba(37,99,235,.15);
}

.session-title{
    font-size:1.05rem;
    font-weight:600;
    color:var(--text);
    margin-bottom:8px;
}

.speaker{
    color:var(--muted);
    font-size:.95rem;
}

/* Footer */
footer{
    background:#0f172a;
    color:white;
    text-align:center;
    padding:60px 20px;
}

footer h3{
    margin-bottom:15px;
    font-size:1.8rem;
}

footer p{
    margin:10px 0;
    opacity:.9;
}

.footer-tag{
    margin-top:25px;
    color:#94a3b8;
}

/* Mobile */
@media(max-width:768px){

    .hero{
        min-height:auto;
        padding:120px 20px 80px;
    }

    .hero h1{
        font-size:2.5rem;
    }

    .hero .subtitle{
        font-size:1.1rem;
    }

    .hero-logo{
    	position:static;

    	transform:none;

    	height:50px;

    	display:block;

    	margin:0 auto 20px;
}

    .section-title{
        font-size:1.8rem;
    }

    .lang-switch{
        top:15px;
        right:15px;
    }

    .timeline::before{
        left:20px;
    }

    .timeline-item{
        grid-template-columns:1fr;
        gap:10px;
    }

    .timeline-time{
        text-align:left;
        padding-top:0;
    }

    .timeline-marker{
        display:none;
    }
    .timeline-content::before{
        left:-29px;
    }
}
</style>
</head>

f2:"Unlock the Full Value of Data with GIS.",

}
};

function setLang(lang){

const d = translations[lang];

document.getElementById("eventInfoTitle").textContent = d.eventInfo;
document.getElementById("dateLabel").textContent = d.date;
document.getElementById("timeLabel").textContent = d.time;
document.getElementById("locationLabel").textContent = d.location;
document.getElementById("audienceLabel").textContent = d.audience;
document.getElementById("locationText").textContent = d.locationText;
document.getElementById("audienceText").textContent = d.audienceText;
document.getElementById("agendaTitle").textContent = d.agenda;
document.getElementById("tagline").textContent = d.tagline;

for(let i=1;i<=8;i++){
document.getElementById(`s${i}`).textContent = d[`s${i}`];
document.getElementById(`sp${i}`).textContent = d[`sp${i}`];
}

document.getElementById("footer1").textContent = d.f1;
document.getElementById("footer2").textContent = d.f2;

document.getElementById("btn-mn").classList.toggle("active",lang==="mn");
document.getElementById("btn-en").classList.toggle("active",lang==="en");

document.documentElement.lang=lang;
}

setLang("mn");

</script>
